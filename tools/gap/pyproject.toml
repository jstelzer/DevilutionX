[project]
name = "gap-ai"
version = "0.1.0"
description = "Game Agent Protocol AI for DevilutionX"
authors = [{name = "GAP AI Team"}]
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.20.0",
    "black>=22.0.0",
    "ruff>=0.1.0",
]

# No build system needed for scripts-only project.
# uv treats this as a virtual (non-packaged) project — `uv sync` installs the
# dependencies above into .venv without trying to build a wheel.
# Run scripts directly, e.g. `uv run orchestrator.py --model qwen2.5:3b`.
[tool.uv]
package = false

[tool.black]
line-length = 100
target-version = ['py38']

[tool.ruff]
line-length = 100
target-version = "py38"
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings  
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long (black handles this)
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py", "validation_tests.py"]