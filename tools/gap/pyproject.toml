[project]
name = "gap-ai"
version = "0.1.0"
description = "Game Agent Protocol AI for DevilutionX"
authors = [{name = "GAP AI Team"}]
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "aiohttp>=3.8.0",
    "numpy>=1.20.0",
    "typing-extensions>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.20.0",
    "black>=22.0.0",
    "ruff>=0.1.0",
]

# No build system needed for scripts-only project
# [build-system]
# requires = ["hatchling"]
# build-backend = "hatchling.build"

# Script entry points for easy execution
[project.scripts]
gap-mcp-server = "mcp_server:main"
gap-agent = "test_gap_agent:main"
gap-combat = "combat_gap_agent:main"

[tool.black]
line-length = 100
target-version = ['py38']

[tool.ruff]
line-length = 100
target-version = "py38"
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings  
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long (black handles this)
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py", "validation_tests.py"]